name: Live AQI Pipeline

on:
  workflow_dispatch:

  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  update-aqi-forecast:

    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
      HOPSWORKS_HOST: ${{ secrets.HOPSWORKS_HOST }}
      HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-pipeline.txt


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-pipeline.txt


      - name: Verify dependencies
        run: |
          pip check


      - name: Update live AQI features
        run: |
          python 13_live_feature_pipeline.py


      - name: Generate 72-hour AQI forecast
        run: |
          python 14_predict_live.py


      - name: Verify forecast output
        run: |
          python - <<'PY'
          import pandas as pd

          path = "outputs/predictions/latest_72h_forecast.csv"

          df = pd.read_csv(path)

          print(df.head())
          print("Forecast rows:", len(df))

          if len(df) != 72:
              raise RuntimeError(
                  f"Expected 72 rows, got {len(df)}"
              )

          print("Forecast verification successful.")
          PY


      - name: Commit updated forecast
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add outputs/predictions/latest_72h_forecast.csv

          if git diff --cached --quiet; then
            echo "No forecast changes to commit."
          else
            git commit -m "Update live AQI forecast"
            git push
          fi